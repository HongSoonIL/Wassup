{% extends "accounts/entry.html" %}
{% block title %}로그인{% endblock %}
{% block panel %}
  <h1>로그인</h1>
  <form method="post" class="entry-fields">{% csrf_token %}
    {% if form.errors %}<p class="entry-error" role="alert">아이디와 비밀번호를 확인해 주세요.</p>{% endif %}
    <label for="{{ form.username.id_for_label }}">아이디</label>{{ form.username }}
    <label for="{{ form.password.id_for_label }}">비밀번호</label>{{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="people-primary" type="submit">로그인</button>
  </form>
  <p class="entry-switch">처음 오셨나요? <a href="/signup/{% if next %}?next={{ next|urlencode }}{% endif %}">가입하기</a></p>
{% endblock %}
