# 개발용 PostgreSQL + Redis (설계서 2.1절, 2.7절)
# 실행: docker compose up -d   /  중지: docker compose down
# 값은 같은 폴더의 .env에서 읽는다 (.env.example 참고).
# POSTGRES_* 값은 볼륨이 처음 만들어질 때만 적용된다. 바꾼 뒤에는
# docker compose down -v 로 볼륨을 지우고 다시 올려야 한다 (DB 데이터도 지워짐).

services:
  db:
    image: pgvector/pgvector:pg17  # 나중에 기억 의미 검색(pgvector)을 붙일 수 있게
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wassup}
      POSTGRES_USER: ${POSTGRES_USER:-wassup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 적어 주세요}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # 내 컴퓨터에서만 접속 가능
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine  # Celery 작업 대기열 + Channels 이벤트 통로
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
